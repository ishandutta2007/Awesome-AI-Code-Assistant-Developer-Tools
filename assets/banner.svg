<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pill-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pill-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pill-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="pill-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.03); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(10px) scale(0.97); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes radarSweep {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .orb-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 1000px 260px;
      }
      .card-float-left {
        animation: float1 6s ease-in-out infinite;
      }
      .card-float-right {
        animation: float2 7s ease-in-out infinite;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: radarSweep 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Ambient Orbs in Deep Background -->
  <circle class="orb-1" cx="220" cy="90" r="180" fill="#3b82f6" filter="url(#glow)" opacity="0.4" />
  <circle class="orb-2" cx="980" cy="240" r="190" fill="#8b5cf6" filter="url(#glow)" opacity="0.35" />
  <circle cx="600" cy="180" r="140" fill="#06b6d4" filter="url(#glow)" opacity="0.15" />

  <!-- Background Ambient Circuit/Tech Lines (Behind text layer) -->
  <g opacity="0.35">
    <path class="stream-line" d="M 0 80 Q 300 120 600 60 T 1200 100" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="stream-line" d="M 0 280 Q 400 210 800 290 T 1200 240" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Dynamic Floating Decorative Tech Cards (Sides only - keeping center clear) -->
  <!-- Left Side Dynamic Card -->
  <g class="card-float-left" opacity="0.85">
    <rect x="40" y="55" width="210" height="74" rx="12" fill="url(#pill-grad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)"/>
    <circle cx="65" cy="92" r="14" fill="#0284c7" opacity="0.5" />
    <text x="65" y="96" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="90" y="86" fill="#f8fafc" font-size="12" font-weight="700">Autonomous Agents</text>
    <text x="90" y="104" fill="#94a3b8" font-size="10">SWE-agent • OpenHands</text>
  </g>

  <g class="card-float-left" opacity="0.85" style="animation-delay: -3s;">
    <rect x="40" y="230" width="220" height="74" rx="12" fill="url(#pill-grad2)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)"/>
    <circle cx="65" cy="267" r="14" fill="#7c3aed" opacity="0.5" />
    <text x="65" y="271" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle">⌘</text>
    <text x="90" y="261" fill="#f8fafc" font-size="12" font-weight="700">AI Code Editors</text>
    <text x="90" y="279" fill="#94a3b8" font-size="10">Cursor • Windsurf • Zed</text>
  </g>

  <!-- Right Side Dynamic Card -->
  <g class="card-float-right" opacity="0.85">
    <rect x="940" y="55" width="220" height="74" rx="12" fill="url(#pill-grad3)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)"/>
    <circle cx="965" cy="92" r="14" fill="#059669" opacity="0.5" />
    <text x="965" y="96" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle">✨</text>
    <text x="990" y="86" fill="#f8fafc" font-size="12" font-weight="700">Pair Programmers</text>
    <text x="990" y="104" fill="#94a3b8" font-size="10">Copilot • Tabnine • Supermaven</text>
  </g>

  <g class="card-float-right" opacity="0.85" style="animation-delay: -3.5s;">
    <rect x="940" y="230" width="220" height="74" rx="12" fill="url(#pill-grad4)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.2" backdrop-filter="blur(8px)"/>
    <circle cx="965" cy="267" r="14" fill="#e11d48" opacity="0.5" />
    <text x="965" y="271" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle">🔒</text>
    <text x="990" y="261" fill="#f8fafc" font-size="12" font-weight="700">Self-Hosted &amp; Local</text>
    <text x="990" y="279" fill="#94a3b8" font-size="10">Continue • Cline • Tabby</text>
  </g>

  <!-- FOREGROUND LAYER: Primary Title & Subtitle (Completely clear, unblocked, high-contrast) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <rect x="460" y="44" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="600" y="63" fill="#38bdf8" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">✨ AWESOME ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="600" y="132" fill="url(#primary-glow)" font-size="40" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      AI Code Assistant
    </text>
    <text x="600" y="180" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      &amp; Developer Tools
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="222" fill="#94a3b8" font-size="15.5" font-weight="500" text-anchor="middle">
      Curated Guide to AI IDEs, Pair Programmers, Autonomous Coding Agents &amp; Local Workflows
    </text>

    <!-- Bottom Metric Pills -->
    <g transform="translate(380, 260)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="65" y="20" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">🚀 10+ SaaS Tools</text>

      <rect x="150" y="0" width="140" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="220" y="20" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">⭐ 1M+ OSS Stars</text>

      <rect x="310" y="0" width="130" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="375" y="20" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">🔥 100% Free Tiers</text>
    </g>
  </g>
</svg>
